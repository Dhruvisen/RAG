[project]
name = "corrective-rag"
version = "1.0.0"
description = "Corrective RAG application"
requires-python = ">=3.11"
dependencies = [
    # Core RAG infrastructure
    "chromadb>=0.4.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.2",
    "pdfplumber>=0.10.0",
    "nltk>=3.8.1",
    # CRAG additions
    "rank-bm25>=0.2.2",
    "requests>=2.31.0",
    "urllib3>=2.0.7",
    "boto3>=1.34.0",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "ddgs>=9.16.0",
    "python-docx>=1.1.0",
    "rich>=13.7.0",
    "ollama>=0.2.0",
    "duckduckgo-search>=6.0.0",
    # Web server
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "pandas>=3.0.6",
    "openpyxl>=3.1.5",
    "tabulate>=0.10.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]
